[project]
name = "streetwatch-ai"
version = "0.1.0"
description = "StreetWatch AI training pipeline"
requires-python = ">=3.9"

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",

    "opencv-python>=4.8.0",
    "numpy>=1.24.0",

    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    "onnx-tf>=1.10.0",
    "tensorflow>=2.13.0",

    "Pillow>=10.0.0",
    "tqdm>=4.65.0"
]